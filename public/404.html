<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1410" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page introuvable – DinoTeam</title>
    <style>
            :root {
        --leaf: #b9ec6b;
        --leaf-fg: #0f1f14;
        --bg: #0d1410;
        --card: #121b15;
        --text: #f1f3ec;
        --muted: #a5b0a6;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
        background: radial-gradient(ellipse at top, #1b3a26 0%, var(--bg) 70%);
        color: var(--text);
        font-family: 'Manrope', system-ui, sans-serif;
        line-height: 1.55;
        text-align: center;
      }
      main {
        max-width: 560px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .label {
        margin: 0;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--leaf);
      }
      h1 {
        margin: 0;
        font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        font-weight: 900;
        font-size: clamp(120px, 30vw, 200px);
        line-height: 0.85;
        color: var(--leaf);
      }
      .sub {
        margin: 0;
        font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        font-weight: 700;
        font-size: 30px;
        text-transform: uppercase;
      }
      p.text {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 14px 28px;
        border-radius: 6px;
        background: var(--leaf);
        color: var(--leaf-fg);
        font-family: 'Manrope', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.88;
      }
      .btn:focus-visible {
        outline: 2px solid var(--leaf);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Spécimen introuvable</p>
      <h1>404</h1>
      <p class="sub">Cette page a disparu</p>
      <p class="text">
        Elle a peut-être été déplacée, ou l'adresse contient une faute de frappe. Pas de panique,
        le reste de la team est toujours là.
      </p>
      <a href="/" class="btn">Retour à l'accueil</a>
    </main>
  </body>
</html>
